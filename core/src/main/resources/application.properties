spring.datasource.url=jdbc:mysql://127.0.0.1:3306/reviews_analyzer_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
app.rabbit.exchange=analyses-exchange
app.rabbit.task-queue=analyses-task-queue
app.rabbit.task-routing-key=analyses.routing.key
app.rabbit.result-queue=analyses-results-queue
app.rabbit.result-routing-key=analyses.results.key





